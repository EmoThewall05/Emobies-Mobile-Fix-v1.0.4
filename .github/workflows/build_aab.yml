name: Build AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      
      - run: flutter pub get

      - run: flutter pub run flutter_launcher_icons
      
      - run: flutter build appbundle --release --verbose || true

      - name: Find aab file
        run: find /home/runner/work -iname "*.aab" -o -iname "*.aab" 2>/dev/null || echo "No aab found"

      - name: List build output dir
        run: find android/app/build/outputs -type f 2>/dev/null || echo "outputs dir missing"
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
